# Keycloak + Postgres compose.
# Run with: docker compose up -d
# postgres and keycloak resolve each other by service name on the default
# network that compose creates automatically for this file.
#
# Runtime values are loaded from keycloak/.env (see keycloak/.env.example).

services:
  postgres:
    image: postgres:16
    container_name: keycloak_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in keycloak/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in keycloak/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in keycloak/.env}
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT in keycloak/.env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in keycloak/.env} -d ${POSTGRES_DB:?Set POSTGRES_DB in keycloak/.env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_server
    # `start-dev` runs Keycloak in dev mode (HTTP, no TLS).
    # For production, switch to: start --optimized  (and front it with TLS)
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in keycloak/.env}
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in keycloak/.env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in keycloak/.env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in keycloak/.env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in keycloak/.env}
    ports:
      - "${KEYCLOAK_PORT:?Set KEYCLOAK_PORT in keycloak/.env}:8080"
    volumes:
      - ../theme/login:/opt/keycloak/themes/parc-automobile/login
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
