<app-service-unavailable *ngIf="keycloakError; else appShell" (retried)="reloadPage()"></app-service-unavailable>

<ng-template #appShell>
  <div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
    <div class="mobile-backdrop" [class.visible]="sidebarOpen" (click)="sidebarOpen = false"></div>

    <app-sidebar [items]="visibleNavigation" [open]="sidebarOpen" [collapsed]="sidebarCollapsed" (closed)="sidebarOpen = false" (collapsedChange)="sidebarCollapsed = $event"></app-sidebar>

    <div class="main-column">
      <app-topbar [authenticated]="isAuthenticated" [initials]="userInitials" [fullName]="fullName" [role]="primaryRole" (menuOpened)="toggleSidebar()" (accountOpened)="manageAccount()" (loggedIn)="login()" (loggedOut)="logout()"></app-topbar>

      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
  <app-toast-container></app-toast-container>

  <app-session-timeout-modal
    [visible]="(inactivity.showWarning$ | async) === true"
    [countdown]="(inactivity.countdown$ | async) ?? 60"
    (extended)="inactivity.extendSession()"
    (loggedOut)="logout()">
  </app-session-timeout-modal>
</ng-template>
