@if (keycloakError) {
  <app-service-unavailable (retried)="reloadPage()"></app-service-unavailable>
} @else {
  <div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
    <div class="mobile-backdrop" [class.visible]="sidebarOpen" (click)="sidebarOpen = false"></div>
    <app-sidebar
      [items]="visibleNavigation"
      [open]="sidebarOpen"
      [collapsed]="sidebarCollapsed"
      [authenticated]="isAuthenticated"
      [userInitials]="userInitials"
      [userFullName]="fullName"
      [userRole]="primaryRole"
      (closed)="sidebarOpen = false"
      (collapsedChange)="modifierEtatSidebar($event)"
      (accountOpened)="sidebarOpen = false; manageAccount()"
      (loggedIn)="login()"
      (loggedOut)="logout()">
    </app-sidebar>
    <div class="main-column">
      <button class="mobile-menu-button" type="button" aria-label="Ouvrir le menu" aria-controls="main-sidebar" [attr.aria-expanded]="sidebarOpen" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
      </button>
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
  <app-toast-container></app-toast-container>
  <app-utilisateur-dialog
    [open]="profilOuvert"
    mode="profil"
    [utilisateur]="profilUtilisateur"
    [chargement]="profilChargement"
    [erreur]="profilErreur"
    (closed)="profilOuvert = false; profilErreur = ''"
    (submitted)="enregistrerProfil($event)"
    (passwordChangeRequested)="modifierMotDePasse()">
  </app-utilisateur-dialog>
  <app-session-timeout-modal
    [visible]="(inactivity.showWarning$ | async) === true"
    [countdown]="(inactivity.countdown$ | async) ?? 60"
    (extended)="inactivity.extendSession()"
    (loggedOut)="logout()">
  </app-session-timeout-modal>
}
