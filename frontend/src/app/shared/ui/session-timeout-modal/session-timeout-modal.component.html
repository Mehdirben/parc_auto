@if (visible) {
  <div class="timeout-backdrop">
    <section class="timeout-dialog" role="alertdialog" aria-modal="true" aria-label="Expiration de session" (click)="$event.stopPropagation()">
      <div class="timeout-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2ZM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8Zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7Z"/></svg>
      </div>
      <h2>Session bientôt expirée</h2>
      <p>Votre session sera automatiquement fermée dans</p>
      <div class="countdown-display">
        <div class="countdown-ring">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <circle class="ring-bg" cx="40" cy="40" r="34" />
            <circle class="ring-progress" cx="40" cy="40" r="34"
              [style.stroke-dashoffset]="213.6 - (213.6 * progressPercent / 100)" />
          </svg>
          <span class="countdown-value">{{ formattedCountdown }}</span>
        </div>
      </div>
      <p class="timeout-hint">en raison d'inactivité.</p>
      <div class="timeout-actions">
        <button class="btn btn-secondary" type="button" (click)="loggedOut.emit()">Se déconnecter</button>
        <button class="btn btn-primary" type="button" (click)="extended.emit()">Rester connecté</button>
      </div>
    </section>
  </div>
}
