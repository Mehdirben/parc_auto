<article class="stat-card">
  <div class="stat-icon" [class]="'stat-icon ' + tone">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" [attr.d]="icon"/></svg>
  </div>
  <div class="stat-copy"><span>{{ label }}</span><strong>{{ value }}</strong></div>
</article>
