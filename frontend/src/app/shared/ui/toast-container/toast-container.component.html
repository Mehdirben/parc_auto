<div class="toast-stack" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.messages$ | async; track toast) {
    <article class="toast" [ngClass]="toast.kind">
      <span class="toast-mark">{{ toast.kind === 'success' ? '✓' : toast.kind === 'error' ? '!' : 'i' }}</span>
      <div>
        <strong>{{ toast.title }}</strong>
        @if (toast.message) {
          <p>{{ toast.message }}</p>
        }
      </div>
      <button type="button" aria-label="Fermer la notification" (click)="toastService.dismiss(toast.id)">×</button>
    </article>
  }
</div>
