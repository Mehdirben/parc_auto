<div class="reusable-form-field">
  <label [attr.for]="controlId">{{ label }} @if (required) {
    <span class="required">*</span>
  }</label>
  <ng-content></ng-content>
  @if (help) {
    <small class="field-help">{{ help }}</small>
  }
  @if (error) {
    <small class="field-error">{{ error }}</small>
  }
</div>
