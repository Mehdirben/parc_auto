@if (visible) {
  <div class="table-loading" aria-label="Chargement">
    @for (row of rowItems; track row) {
      <div class="table-loading-row" [style.grid-template-columns]="columns">
        @for (cell of cellItems; track cell) {
          <span class="skeleton" [class.wide]="cell === 1" [class.medium]="cell === 3"></span>
        }
      </div>
    }
  </div>
}
