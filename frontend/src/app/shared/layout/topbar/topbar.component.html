<header class="topbar">
  <div class="topbar-left">
    <button class="menu-button" type="button" aria-label="Ouvrir le menu" (click)="menuOpened.emit()"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg></button>
    <div class="topbar-context"><span>Ministère de l’Enseignement Supérieur</span><strong>Gestion du parc automobile</strong></div>
  </div>
  <div class="topbar-actions">
    <button class="user-menu" type="button" *ngIf="authenticated" (click)="accountOpened.emit()"><span class="avatar">{{ initials }}</span><span class="user-copy"><strong>{{ fullName }}</strong><small>{{ (role || 'Utilisateur') | titlecase }}</small></span><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="m7 10 5 5 5-5H7Z"/></svg></button>
    <button class="btn btn-secondary btn-compact" type="button" *ngIf="authenticated" (click)="loggedOut.emit()">Déconnexion</button>
    <button class="btn btn-primary btn-compact" type="button" *ngIf="!authenticated" (click)="loggedIn.emit()">Connexion</button>
  </div>
</header>
