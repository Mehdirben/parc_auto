<app-page-header
  eyebrow="Vue d’ensemble"
  title="Tableau de bord"
  [description]="isAuthenticated ? 'Bienvenue, ' + fullName + '. Retrouvez les principaux modules de gestion du parc.' : 'Connectez-vous pour accéder aux fonctions sécurisées de gestion du parc.'">
</app-page-header>

<app-hero-banner
  kicker="MESRSI · Parc automobile"
  title="Une vue centralisée pour piloter le parc"
  description="Référentiels, véhicules, affectations et documents de mission réunis dans un espace sécurisé et traçable.">
</app-hero-banner>

<section class="metric-grid" aria-label="Indicateurs du parc">
  <app-stat-card *ngFor="let metric of metrics" [label]="metric.label" [value]="metric.value" [tone]="metric.tone" [icon]="metric.icon"></app-stat-card>
</section>
