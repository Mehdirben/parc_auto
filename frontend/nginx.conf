server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fallback to index.html for Angular client-side SPA routing
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the Spring Boot backend API.
    # The upstream name `backend` matches the docker-compose service name.
    # Adjust `proxy_pass` to point at your API host/port when wiring up the backend.
    location /api/ {
        # Use a variable so nginx does not fail to start before the optional
        # backend service exists in Docker DNS.
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long-lived JWT validation calls / large payloads
        proxy_read_timeout 60s;
    }

    # PDF.js loads its worker as an ES module. Browsers reject module workers
    # when nginx serves .mjs files with the generic application/octet-stream MIME type.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type application/javascript;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache control for static assets to improve performance
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
