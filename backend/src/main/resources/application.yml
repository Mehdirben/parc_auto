spring:
  application:
    name: parc-automobile-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=parc_automobile;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/parc-automobile/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  mock-data:
    enabled: ${MOCK_DATA_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4205}
  keycloak:
    server-base-url: ${KEYCLOAK_SERVER_BASE_URL:http://localhost:8085}
    admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8085/admin/realms}
    realm: ${KEYCLOAK_REALM:parc-automobile}
